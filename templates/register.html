<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Word Guess - Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="center-page">
<div class="card auth-card">
    <h1>Create Player Account</h1>
    <p class="muted">Username: 5+ letters. Password: 5+ chars with letters, number and $, % or *.</p>
    <form id="registerForm">
        <label>Username</label>
        <input id="username" required minlength="5" pattern="[A-Za-z]{5,}" autocomplete="username">
        <label>Password</label>
        <input id="password" type="password" required autocomplete="new-password">
        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" required autocomplete="new-password">
        <button type="submit">Register</button>
    </form>
    <p id="message" class="message"></p>
    <p class="muted">Already registered? <a href="/login">Login</a></p>
</div>
<script src="/static/js/auth.js"></script>
</body>
</html>
